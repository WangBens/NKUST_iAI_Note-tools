name: Build & Publish Desktop App Releases

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to publish (e.g., v1.1.0)"
        required: true
        default: "v1.1.0"

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            args: --win nsis zip
          - os: macos-latest
            platform: mac
            args: --mac dmg zip
          - os: ubuntu-latest
            platform: linux
            args: --linux AppImage deb

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack & Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Run Automated Tests
        run: pnpm run test

      - name: Build Web Application
        run: pnpm run build

      - name: Package Desktop Application (${{ matrix.platform }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm exec electron-builder ${{ matrix.args }} --publish never

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: warn

  publish-release:
    needs: build-desktop
    runs-on: ubuntu-latest
    steps:
      - name: Download All Platform Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten Release Files
        run: |
          mkdir -p dist-release
          find artifacts -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.zip" -o -name "*.AppImage" -o -name "*.deb" \) -exec cp {} dist-release/ \;
          ls -lh dist-release/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: "${{ inputs.tag_name || github.ref_name }}｜知音筆記 NKUST iAI Note Tools (Windows / macOS / Linux)"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 知音筆記｜NKUST iAI Note Tools 跨平台桌面版 APP

            > **專案初衷**：如果老師上課允許錄音，學生就可以利用錄音串接學校提供的 AI 模型（高科 iAI `Asr` 與 `Nkust` / `Furen` 系列），整理成一份屬於自己的學習重點。

            ### 📦 跨平台桌面版 APP 下載
            - **Windows (x64)**：下載 `Setup.exe`（標準安裝版）或 `.zip`（免安裝綠色版，解壓縮即可執行）
            - **macOS (Apple Silicon `arm64` / Intel `x64`)**：下載 `.dmg` 或 `.zip`
            - **Linux (x64)**：下載 `.AppImage`（通用免安裝）或 `.deb`（Ubuntu / Debian 安裝包）

            ### ✨ 本版亮點與版本更新（v1.1.0）
            - **整份逐字稿單次直出模式（Single-Shot Direct Markdown）**：善用高科 iAI `128K～1M` 長上下文視窗，60,000 字元以內直接單次呼叫輸出唯一一份連貫的五段式 Markdown 講義（取代過去 20～35 通分段 JSON 呼叫），徹底消除分段重複拼湊與 JSON 跳脫破裂問題，速度提升 10 倍、大幅節省 Token 額度。
            - **全面強制關閉思考模式（`enable_thinking: false`）**：前端與本機橋接器雙層鎖定關閉推論思考模式（實測 `reasoning_tokens = 0`）並調降溫度至 `0.1`，大幅加快回應速度並避免過度發散。
            - **跨學科通用「程式級防腦補引擎」（`enforceSourceGrounding`）**：自動解析逐字稿中的所有阿拉伯與中文口語數字及十六進位位址，程式化攔截無來源的硬體規格數值、外部架構與虛構實體，並自動修復行內公式、表格對齊與 Token 退化亂碼。
            - **全新五段式實戰學習講義結構**：統一輸出「這堂課在講什麼（含建議閱讀順序、核心主軸）」、「核心專有名詞對照表／符號與單位」、分章正文教學、「總整理表」、「常見失分點與迷思」、「老師可能會考的考題」與「考前自我檢查」。
            - **高科 iAI 六款 LLM 實機盲測驗證**：完成 6 大跨學科領域與 34 分鐘真實錄音實機驗證，確認 **`Furen-std`** 為綜合速度、零亂碼與品質首選，全專案通過 **117 項自動化測試**。
            - **單檔上限提升至 100 MB & 三平台桌面安裝包**：同步提供 Windows、macOS、Linux 三大作業系統桌面版 APP，並內建首次啟動捷徑精靈與零個資留存保護。
          files: dist-release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
