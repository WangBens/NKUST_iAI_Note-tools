name: Build & Publish Desktop App Releases

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to publish (e.g., v1.3.0)"
        required: true
        default: "v1.3.0"

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            args: --win nsis zip
          - os: macos-latest
            platform: mac
            args: --mac dmg zip
          - os: ubuntu-latest
            platform: linux
            args: --linux AppImage deb

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack & Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Run Automated Tests
        run: pnpm run test

      - name: Build Web Application
        run: pnpm run build

      - name: Package Desktop Application (${{ matrix.platform }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm exec electron-builder ${{ matrix.args }} --publish never

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: warn

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Generate Android Release Keystore & Build APK
        working-directory: android
        run: |
          TAG="${{ inputs.tag_name || github.ref_name }}"
          VER="${TAG#v}"
          keytool -genkeypair -v \
            -keystore /tmp/nkust-release.jks \
            -storepass nkustiai2026 \
            -keypass nkustiai2026 \
            -alias nkustiai \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=NKUST iAI Note Tools, OU=OpenSource, O=WangBens, L=Kaohsiung, ST=Taiwan, C=TW"
          ANDROID_KEYSTORE_PATH=/tmp/nkust-release.jks gradle -PAPP_VERSION="$VER" assembleRelease
          mkdir -p out-apk
          cp app/build/outputs/apk/release/app-release.apk "out-apk/NKUST-iAI-Note-Tools-${VER}-android.apk"
          ls -lh out-apk/

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-android
          path: android/out-apk/*.apk

  publish-release:
    needs: [build-desktop, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download All Platform Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten Release Files
        run: |
          mkdir -p dist-release
          find artifacts -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.zip" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.apk" \) -exec cp {} dist-release/ \;
          ls -lh dist-release/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: "${{ inputs.tag_name || github.ref_name }}｜知音筆記 NKUST iAI Note Tools (Windows / macOS / Linux / Android)"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 知音筆記｜NKUST iAI Note Tools 跨平台桌面與 Android 版 APP

            > **專案初衷**：如果老師上課允許錄音，學生就可以利用錄音串接學校提供的 AI 模型（高科 iAI `Asr` 與 `Nkust` / `Furen` 系列），整理成一份屬於自己的學習重點。

            ### 📦 跨平台安裝包下載
            - **Windows (x64)**：下載 `Setup.exe`（標準安裝版）或 `.zip`（免安裝綠色版，解壓縮即可執行）
            - **macOS (Apple Silicon `arm64` / Intel `x64`)**：下載 `.dmg` 或 `.zip`
            - **Linux (x64)**：下載 `.AppImage`（通用免安裝）或 `.deb`（Ubuntu / Debian 安裝包）
            - **Android 手機**：下載 `NKUST-iAI-Note-Tools-x.x.x-android.apk` 直接安裝使用（支援手機選取錄音檔與直接下載 `.md` 筆記至「下載」資料夾）

            ### ✨ 本版亮點與版本更新（v1.3.0）
            - **新增 Android 手機版 APK**：正式於 Releases 同步提供 Android 手機安裝包，隨時隨地用手機上傳課堂錄音整理筆記。
            - **「檢查更新」按鈕＋更新內容確認彈窗**：桌面版左上角新增常駐 **「檢查更新」** 按鈕（同時支援啟動自動背景搜尋新版）；點擊後會彈出視窗顯示**最新版本更新內容**，待使用者按下**「確認並開始更新」**後才開始下載並安裝更新。
            - **介面視覺優化與開源連結**：主畫面底部新增開源專案連結（`https://github.com/WangBens/NKUST_iAI_Note-tools`），並隱藏右側多餘捲軸使桌面介面更俐落乾淨。
            - **LaTeX 渲染防崩潰與 `<system_rules>` / `<lecture_transcript>` 隔離**：修復 72% LaTeX 暫停問題，全 6 款高科 iAI 模型實機通過 LaTeX 匯出驗證（120/120 自動化測試全數通過）。
          files: dist-release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
