name: Build & Publish Desktop App Releases

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to publish (e.g., v1.2.0)"
        required: true
        default: "v1.2.0"

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            args: --win nsis zip
          - os: macos-latest
            platform: mac
            args: --mac dmg zip
          - os: ubuntu-latest
            platform: linux
            args: --linux AppImage deb

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack & Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Run Automated Tests
        run: pnpm run test

      - name: Build Web Application
        run: pnpm run build

      - name: Package Desktop Application (${{ matrix.platform }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm exec electron-builder ${{ matrix.args }} --publish never

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: warn

  publish-release:
    needs: build-desktop
    runs-on: ubuntu-latest
    steps:
      - name: Download All Platform Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten Release Files
        run: |
          mkdir -p dist-release
          find artifacts -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.zip" -o -name "*.AppImage" -o -name "*.deb" \) -exec cp {} dist-release/ \;
          ls -lh dist-release/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: "${{ inputs.tag_name || github.ref_name }}｜知音筆記 NKUST iAI Note Tools (Windows / macOS / Linux)"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 知音筆記｜NKUST iAI Note Tools 跨平台桌面版 APP

            > **專案初衷**：如果老師上課允許錄音，學生就可以利用錄音串接學校提供的 AI 模型（高科 iAI `Asr` 與 `Nkust` / `Furen` 系列），整理成一份屬於自己的學習重點。

            ### 📦 跨平台桌面版 APP 下載
            - **Windows (x64)**：下載 `Setup.exe`（標準安裝版）或 `.zip`（免安裝綠色版，解壓縮即可執行）
            - **macOS (Apple Silicon `arm64` / Intel `x64`)**：下載 `.dmg` 或 `.zip`
            - **Linux (x64)**：下載 `.AppImage`（通用免安裝）或 `.deb`（Ubuntu / Debian 安裝包）

            ### ✨ 本版亮點與版本更新（v1.2.0）
            - **桌面版啟動自動檢查更新 & 左上角一鍵自動更新**：開啟桌面版 APP 時背景自動查詢 GitHub Releases 最新版本；若有新版本，視窗左上角「知音筆記」旁將自動顯示 **「更新至 vX.X.X」** 按鈕，點擊即可即時顯示下載進度（`0% → 100%`）並依作業系統（Windows `Setup.exe` / macOS `.dmg` / Linux `.AppImage`）自動啟動新版安裝更新（網頁版維持原貌不更動）。
            - **整份逐字稿單次直出模式 & 雙層關閉思考模式**：60,000 字元內單次 1 通呼叫直出完整五段式講義，全面鎖定 `enable_thinking: false`（實測 `reasoning_tokens = 0`）與跨學科程式級防腦補引擎（`enforceSourceGrounding`）。
            - **三平台桌面安裝包 & 119 項自動化測試**：同步發布 Windows、macOS、Linux 安裝檔，內建首次啟動捷徑精靈與零個資留存保護。
          files: dist-release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
